name: Remote Android Build

on:
  push:
    branches: [ feature/custom-season-posters ] # Tells GitHub to ONLY build for this branch
  workflow_dispatch: # Keeps the manual run button active just in case

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioMobile-Test-Build
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
