# =============================================================================
# Nuvio Multi-Platform Release Builder (Android + Web)
# =============================================================================
# To change the trigger branch, update TRIGGER_BRANCH in both places:
#   1. `on.push.branches`  (line 24)
#   2. `env.TRIGGER_BRANCH`  (line 11)
# The `workflow_dispatch` input `target_branch` overrides it at runtime.
# =============================================================================

name: Build Release (Android + Web)

env:
  TRIGGER_BRANCH: "build/android-web"

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build (leave empty for default)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - "build/android-web"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── Branch Resolution ──────────────────────────────────────────
      - name: Resolve target branch
        id: resolve_branch
        run: |
          INPUT_BRANCH="${{ github.event.inputs.target_branch }}"
          if [ -z "$INPUT_BRANCH" ]; then
            CHOSEN_BRANCH="${{ env.TRIGGER_BRANCH }}"
          else
            CHOSEN_BRANCH="$INPUT_BRANCH"
          fi
          echo "branch=$CHOSEN_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Selected branch: $CHOSEN_BRANCH"

      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_branch.outputs.branch }}
          fetch-depth: 0

      # ── Environment ────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # ── Secrets → local.properties ────────────────────────────────
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/nuvio-release.keystore"

      - name: Write local.properties
        run: |
          printf 'SUPABASE_URL=%s\n' "${{ secrets.SUPABASE_URL }}" > local.properties
          printf 'SUPABASE_ANON_KEY=%s\n' "${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          printf 'TRAKT_CLIENT_ID=%s\n' "${{ secrets.TRAKT_CLIENT_ID }}" >> local.properties
          printf 'TRAKT_CLIENT_SECRET=%s\n' "${{ secrets.TRAKT_CLIENT_SECRET }}" >> local.properties
          printf 'TRAKT_REDIRECT_URI=%s\n' "${{ secrets.TRAKT_REDIRECT_URI }}" >> local.properties
          printf 'INTRODB_API_URL=%s/\n' "${{ secrets.INTRODB_API_URL }}" >> local.properties
          printf 'TMDB_API_KEY=%s\n' "${{ secrets.TMDB_API_KEY }}" >> local.properties
          printf 'NUVIO_RELEASE_STORE_FILE=%s/nuvio-release.keystore\n' "${{ github.workspace }}" >> local.properties
          printf 'NUVIO_RELEASE_STORE_PASSWORD=%s\n' "nuvio1234" >> local.properties
          printf 'NUVIO_RELEASE_KEY_ALIAS=%s\n' "nuvio-release" >> local.properties
          printf 'NUVIO_RELEASE_KEY_PASSWORD=%s\n' "nuvio1234" >> local.properties
          printf 'DONATIONS_BASE_URL=%s\n' "https://donations.nuvioapp.space/" >> local.properties
          printf 'DONATIONS_DONATE_URL=%s\n' "https://ko-fi.com/tapframe" >> local.properties
          printf 'CONTRIBUTIONS_URL=%s\n' "${{ secrets.CONTRIBUTION_URL }}" >> local.properties
          printf 'DIRECT_DEBRID_API_BASE_URL=%s\n' "https://api.torbox.app/v1/api" >> local.properties

      # ── Flavor / Tag Meta ─────────────────────────────────────────
      - name: Set flavor variables
        id: flavor
        run: |
          BRANCH_NAME="${{ steps.resolve_branch.outputs.branch }}"
          BRANCH_LOWER=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9]/-/g')
          echo "name=${BRANCH_LOWER}" >> "$GITHUB_OUTPUT"

      # ── Changelog ─────────────────────────────────────────────────
      - name: Generate Changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Previous release found: $PREV_TAG"
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "No previous release, taking last 20 commits"
            COMMITS=$(git log HEAD --pretty=format:"- %s (%h)" --no-merges -n 20)
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- No changes since last release"
          fi

          {
            echo "## Nuvio Release Build #${{ github.run_number }}"
            echo ""
            echo "**Target branch:** \`${{ steps.resolve_branch.outputs.branch }}\`"
            if [ -n "$PREV_TAG" ]; then
              echo "**Previous Version:** \`$PREV_TAG\`"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## Changes"
            echo ""
            echo "$COMMITS"
          } > release_body.md

      # ── Build: Android Full Release ───────────────────────────────
      - name: Build Android Full APK
        run: |
          ./gradlew :composeApp:assembleFullRelease

      # ── Build: Android Play Store Release ─────────────────────────
     # - name: Build Android Play Store APK
     #   run: |
     #     ./gradlew :composeApp:assemblePlaystoreRelease

      # ── Build: Web (WasmJs) ──────────────────────────────────────
      - name: Build Web (WasmJs)
        run: |
          ./gradlew :composeApp:compileKotlinWasmJs

      # ── Collect Web Artifacts ─────────────────────────────────────
      - name: Collect Web distribution
        run: |
          mkdir -p web-dist
          cp -r composeApp/build/compileSync/wasmJs/main/productionExecutable/kotlin web-dist/ 2>/dev/null || true
          cp -r composeApp/build/compileSync/wasmJs/main/productionExecutable/resources web-dist/ 2>/dev/null || true
          # If a browser distribution task exists in the future, it will land here:
          cp -r composeApp/build/dist/wasmJs/main web-dist/dist 2>/dev/null || true

      # ── Create GitHub Release ─────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}-${{ steps.flavor.outputs.name }}"
          name: "Nuvio Build - ${{ steps.resolve_branch.outputs.branch }} #${{ github.run_number }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          target_commitish: ${{ steps.resolve_branch.outputs.branch }}
          files: |
            composeApp/build/outputs/apk/full/release/*.apk
            composeApp/build/outputs/apk/playstore/release/*.apk
            web-dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Notification ──────────────────────────────────────────────
      - name: Send ntfy Notification
        run: |
          curl \
            -H "Title: Nuvio Build Complete" \
            -H "Priority: high" \
            -H "Tags: rocket,android,globe_with_meridians" \
            -H "Click: https://github.com/${{ github.repository }}/releases/tag/v1.0.${{ github.run_number }}-${{ steps.flavor.outputs.name }}" \
            -d "## Nuvio Build #${{ github.run_number }} — done 🚀
            Branch: \`${{ steps.resolve_branch.outputs.branch }}\`
            Android Full APK ✅
            Android Play Store APK ✅
            Web (WasmJs) ✅
            [Open Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/v1.0.${{ github.run_number }}-${{ steps.flavor.outputs.name }})" \
            https://ntfy.sh/nuvio_builds
