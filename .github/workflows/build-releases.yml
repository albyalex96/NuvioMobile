# =============================================================================
# Nuvio Enhanced Multi-Platform Release Builder (Android + Web)
# =============================================================================
# To change the trigger branch, update TRIGGER_BRANCH in both places:
#   1. `on.push.branches`  (line 24)
#   2. `env.TRIGGER_BRANCH`  (line 11)
# The `workflow_dispatch` input `target_branch` overrides it at runtime.
# =============================================================================

name: Build Release (Android + Web)

env:
  TRIGGER_BRANCH: "build/cmp"

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to build (leave empty for default)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - "build/cmp"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── Branch Resolution ──────────────────────────────────────────
      - name: Resolve target branch
        id: resolve_branch
        run: |
          INPUT_BRANCH="${{ github.event.inputs.target_branch }}"
          if [ -z "$INPUT_BRANCH" ]; then
            CHOSEN_BRANCH="${{ env.TRIGGER_BRANCH }}"
          else
            CHOSEN_BRANCH="$INPUT_BRANCH"
          fi
          echo "branch=$CHOSEN_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Selected branch: $CHOSEN_BRANCH"

      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_branch.outputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      # ── Environment ────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache npm/yarn (wasmJs webpack)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/yarn
            composeApp/.gradle/kotlinJs
          key: npm-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Enable Gradle build cache
        run: |
          mkdir -p ~/.gradle
          # GitHub ubuntu-latest has ~7 GB RAM → constrain heaps to avoid OOM
          echo "org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8" > ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.vfs.watch=false" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx4G" >> ~/.gradle/gradle.properties

      # ── Secrets → local.properties ────────────────────────────────
      - name: Write local.properties
        run: |
          printf 'SUPABASE_URL=%s\n' "${{ secrets.SUPABASE_URL }}" > local.properties
          printf 'SUPABASE_ANON_KEY=%s\n' "${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          printf 'TRAKT_CLIENT_ID=%s\n' "${{ secrets.TRAKT_CLIENT_ID }}" >> local.properties
          printf 'TRAKT_CLIENT_SECRET=%s\n' "${{ secrets.TRAKT_CLIENT_SECRET }}" >> local.properties
          printf 'TRAKT_REDIRECT_URI=%s\n' "${{ secrets.TRAKT_REDIRECT_URI }}" >> local.properties
          printf 'INTRODB_API_URL=%s/\n' "${{ secrets.INTRODB_API_URL }}" >> local.properties
          printf 'TMDB_API_KEY=%s\n' "${{ secrets.TMDB_API_KEY }}" >> local.properties
          printf 'DONATIONS_BASE_URL=%s\n' "https://donations.nuvioapp.space/" >> local.properties
          printf 'DONATIONS_DONATE_URL=%s\n' "https://ko-fi.com/tapframe" >> local.properties
          printf 'CONTRIBUTIONS_URL=%s\n' "${{ secrets.CONTRIBUTION_URL }}" >> local.properties
          printf 'DIRECT_DEBRID_API_BASE_URL=%s\n' "https://api.torbox.app/v1/api" >> local.properties

      # ── Flavor / Tag Meta ─────────────────────────────────────────
      - name: Set flavor variables
        id: flavor
        run: |
          BRANCH_NAME="${{ steps.resolve_branch.outputs.branch }}"
          BRANCH_LOWER=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9]/-/g')
          echo "name=${BRANCH_LOWER}" >> "$GITHUB_OUTPUT"

      # ── Changelog ─────────────────────────────────────────────────
      - name: Generate Changelog
        id: changelog
        run: |
          COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -n 30)

          {
            echo "## Nuvio Enhanced Release Build #${{ github.run_number }}"
            echo ""
            echo "**Target branch:** \`${{ steps.resolve_branch.outputs.branch }}\`"
            echo ""
            echo "---"
            echo ""
            echo "## Changes"
            echo ""
            echo "$COMMITS"
          } > release_body.md

      # ── Build: Android Full Release ───────────────────────────────
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/nuvio-release.keystore
          echo "NUVIO_RELEASE_STORE_FILE=${{ github.workspace }}/nuvio-release.keystore" >> local.properties
          echo "NUVIO_RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> local.properties
          echo "NUVIO_RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> local.properties
          echo "NUVIO_RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> local.properties

      - name: Build Android Full APK
        run: |
          ./gradlew :composeApp:assembleFullRelease -x test --build-cache

      # ── Build: Web (WasmJs) ──────────────────────────────────────
      - name: Build Web (WasmJs Browser Distribution)
        run: |
          ./gradlew --stop
          ./gradlew :composeApp:wasmJsBrowserDistribution -x test --build-cache --max-workers=1

      # ── Collect Web Artifacts ─────────────────────────────────────
      - name: Collect Web artifacts into web-dist/
        run: |
          mkdir -p web-dist
          cp -r composeApp/build/dist/wasmJs/productionExecutable/* web-dist/ 2>/dev/null || true
          echo "📦 web-dist contents:"
          ls -la web-dist/

      # ── Docker: Build & Push Web Image ────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=v1.0.${{ github.run_number }}
            type=raw,value=${{ steps.flavor.outputs.name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
                    
      # ── Create GitHub Release ─────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}-${{ steps.flavor.outputs.name }}"
          name: "Nuvio Enhanced Build - ${{ steps.resolve_branch.outputs.branch }} #${{ github.run_number }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          target_commitish: ${{ steps.resolve_branch.outputs.branch }}
          files: |
            composeApp/build/outputs/apk/full/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Notification ──────────────────────────────────────────────
      - name: Send ntfy Notification
        run: |
          curl \
            -H "Title: Nuvio Enhanced Build Complete" \
            -H "Priority: high" \
            -H "Tags: rocket,android,globe_with_meridians" \
            -H "Click: https://github.com/${{ github.repository }}/releases/tag/v1.0.${{ github.run_number }}-${{ steps.flavor.outputs.name }}" \
            -d "## Nuvio Enhanced Build #${{ github.run_number }} — done 🚀
            Branch: \`${{ steps.resolve_branch.outputs.branch }}\`
            Android (Full) ✅ · Web (WasmJs) ✅ · Docker (ghcr.io) ✅
            [Open Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/v1.0.${{ github.run_number }}-${{ steps.flavor.outputs.name }})" \
            https://ntfy.sh/nuvio_builds
