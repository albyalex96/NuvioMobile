<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuvio</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17"></script>
    <script>
      globalThis.nuvioConfigureCanvas = function () {
        const style = document.createElement('style');
        style.textContent = 'canvas { background: transparent !important; } body { background: #000; margin: 0; overflow: hidden; }';
        document.head.appendChild(style);
      };
      globalThis.nuvioCreateVideo = function () {
        const v = document.createElement('video');
        v.crossOrigin = 'anonymous';
        v.preload = 'auto';
        v.playsInline = true;
        v.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:0';
        document.body.insertBefore(v, document.body.firstChild);
        globalThis.nuvioVideoElement = v;
        return true;
      };
      globalThis.nuvioDestroyVideo = function () {
        const v = globalThis.nuvioVideoElement;
        if (v) { v.pause(); v.removeAttribute('src'); v.load(); v.remove(); globalThis.nuvioVideoElement = null; }
        const h = globalThis.nuvioHlsInstance;
        if (h) { h.destroy(); globalThis.nuvioHlsInstance = null; }
        return true;
      };
      globalThis.nuvioSetupSource = function (url, streamType, headersJson) {
        const v = globalThis.nuvioVideoElement;
        if (!v) return JSON.stringify({ ok: false, error: 'no video element' });
        const h = globalThis.nuvioHlsInstance;
        if (h) { h.destroy(); globalThis.nuvioHlsInstance = null; }
        v.removeAttribute('src');
        v.load();
        const isHls = streamType === 'hls' || url.includes('.m3u8');
        const headers = (function () { try { return JSON.parse(headersJson || '{}'); } catch (_) { return {}; } })();
        if (isHls && !v.canPlayType('application/vnd.apple.mpegurl') && typeof Hls !== 'undefined' && Hls.isSupported()) {
          const hls = new Hls({ xhrSetup: function (xhr) { for (var k in headers) { if (Object.prototype.hasOwnProperty.call(headers, k)) xhr.setRequestHeader(k, headers[k]); } } });
          hls.loadSource(url);
          hls.attachMedia(v);
          globalThis.nuvioHlsInstance = hls;
          return JSON.stringify({ ok: true, engine: 'hlsjs' });
        } else {
          v.src = url;
          return JSON.stringify({ ok: true, engine: 'native' });
        }
      };
      globalThis.nuvioVideoPlay = function () { var v = globalThis.nuvioVideoElement; if (v) v.play().catch(function () {}); };
      globalThis.nuvioVideoPause = function () { var v = globalThis.nuvioVideoElement; if (v) v.pause(); };
      globalThis.nuvioVideoSeekTo = function (ms) { var v = globalThis.nuvioVideoElement; if (v) v.currentTime = ms / 1000; };
      globalThis.nuvioVideoSeekBy = function (ms) { var v = globalThis.nuvioVideoElement; if (v) v.currentTime += ms / 1000; };
      globalThis.nuvioVideoSetSpeed = function (speed) { var v = globalThis.nuvioVideoElement; if (v) v.playbackRate = speed; };
      globalThis.nuvioVideoSetMuted = function (muted) { var v = globalThis.nuvioVideoElement; if (v) v.muted = muted; };
      globalThis.nuvioVideoSetVolume = function (vol) { var v = globalThis.nuvioVideoElement; if (v) v.volume = vol; };
      globalThis.nuvioVideoGetSnapshot = function () {
        var v = globalThis.nuvioVideoElement;
        if (!v) return '{}';
        var buf = v.buffered;
        var bufEnd = 0;
        if (buf.length > 0) bufEnd = buf.end(buf.length - 1);
        return JSON.stringify({
          readyState: v.readyState,
          paused: v.paused,
          ended: v.ended,
          currentTime: v.currentTime,
          duration: v.duration || 0,
          bufferedEnd: bufEnd,
          playbackRate: v.playbackRate,
          seeking: v.seeking,
          videoWidth: v.videoWidth,
          videoHeight: v.videoHeight,
          error: v.error ? (v.error.code + ': ' + v.error.message) : null
        });
      };
      globalThis.nuvioVideoGetTrackInfo = function () {
        var v = globalThis.nuvioVideoElement;
        if (!v) return '{}';
        var audioTracks = [];
        var videoTracks = [];
        try { for (var i = 0; i < v.audioTracks.length; i++) { var t = v.audioTracks[i]; audioTracks.push({ index: i, id: t.id || String(i), label: t.label || 'Track ' + i, language: t.language || null, enabled: t.enabled }); } } catch (_) {}
        return JSON.stringify({ audioTracks: audioTracks });
      };
      globalThis.nuvioVideoSelectAudioTrack = function (index) {
        var v = globalThis.nuvioVideoElement;
        if (!v || !v.audioTracks) return;
        try { for (var i = 0; i < v.audioTracks.length; i++) v.audioTracks[i].enabled = (i === index); } catch (_) {}
      };
      globalThis.nuvioVideoCaptureFrame = function (quality) {
        var v = globalThis.nuvioVideoElement;
        if (!v || v.videoWidth === 0 || v.videoHeight === 0) return new Int8Array(0);
        var w = v.videoWidth, h = v.videoHeight;
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.drawImage(v, 0, 0, w, h);
        var dataUrl = c.toDataURL('image/jpeg', quality);
        var binary = atob(dataUrl.split(',')[1]);
        var buf = new ArrayBuffer(binary.length);
        var bytes = new Uint8Array(buf);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new Int8Array(buf);
      };
    </script>
  </head>
  <body>
    <div id="webApp"></div>
    <script>
      globalThis.nuvioConfigureCanvas();
      globalThis.nuvioCreateVideo();
    </script>
    <script src="composeApp.js"></script>
  </body>
</html>
